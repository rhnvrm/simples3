services:
  garage:
    image: dxflrs/garage:v2.4.1
    ports:
      - "127.0.0.1:9000:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    command: ["server"]
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  garage_meta:
  garage_data:
