services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    ports:
      - "127.0.0.1:9000:8333"
    environment:
      # Public local-test credentials; never use in production.
      AWS_ACCESS_KEY_ID: simples3-test
      AWS_SECRET_ACCESS_KEY: simples3-test-secret
      S3_BUCKET: testbucket
    volumes:
      - seaweedfs_data:/data
    command:
      - mini
      - -dir=/data
      - -ip=127.0.0.1
      - -s3.autoCreateBucket=false
      - -s3.allowDeleteBucketNotEmpty=false

volumes:
  seaweedfs_data:
